# Config of the released 1.3B DFM and FS-DFM checkpoints (uniform source), used by run_eval.py.
# Differs from config.yaml in the model size, the flow settings (uniform source) and model.compile.
defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

compute:
  ngpus: 8
  nodes: 1

logging:
  log_freq: 500
  log_lr_every: 5000
  log_file_name: stdout.log
  enable_wandb: False
  entity: flows
  project: flow_matching
  group: null

data:
  train: fineweb-edu
  valid: wikitext103
  cache_dir: ./cache_dir
  num_workers: 8
  small_data: True
  force_process: False
  hf_dataset: True

training:
  batch_size: 96
  snapshot: 5000
  eval_freq: 10000
  perplexity_freq: 10000
  eval_multi_freq: 5000
  seed: 42
  train_teacher: True
  train_student: True
  teacher_type: RK_4
  pre_trained_model: model/checkpoint.pth
  precision: bf16
  use_grad_scaler: False
  unmask_change: False
  teacher_cut_off: False
  teacher_cut_off_it: 0
  controlled_unmasking: False
  controlled_unmasking_type: Training_Testing
  blend_logits: False
  can_apply_dt: True
  use_generator_not_logic: False
  use_ema: True
  ema_decay: 0.9995
  ema_copy_buffers: True
  ema_freq: 1
  just_student: True
  result_len: 10

eval:
  batch_size: 64
  sample_batch_size: 16
  perplexity: True
  perplexity_batch_size: 16

optim:
  weight_decay: 0.03
  optimizer: AdamW
  lr: 1e-5
  teacher_lr: 1e-6
  beta1: 0.9
  beta2: 0.95
  eps: 1e-8
  warmup: 10000
  grad_clip: 1.
  eta_min_ratio: 0.1
  fused: false
  n_iters: 500000
  log_lr_every: 500
  constant_lr: False

flow:
  source_distribution: uniform
  teacher_loss_function: cross_entropy
  student_loss_function: KLDistillation
  temperature: 1.0
  exponent: 1.0
  student_solver: mixture_euler
  scheduler_type: polynomial
  sampling_steps: 1024
  step_sizes: [1.0, 0.5, 0.25, 0.125, 0.0625, 0.03125, 0.015625, 0.0078125, 0.00390625, 0.001953125, 0.0009765625]
  dt_weights: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
  dt_weights_2: False
  dt_weights_2_freq: 20000

model:
  hidden_size: 2048
  cond_dim: 256
  length: 1024
  n_blocks: 21
  n_heads: 32
  dropout: 0.1
  compile: false

hydra_dir: ./outputs

hydra:
  run:
    dir: ${hydra_dir}/output/results
  sweep:
    dir: ${hydra_dir}/output/results
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    timeout_min: 4320
    partition: learn
    qos: null
    gpus_per_node: ${compute.ngpus}
    mem_gb: 1760
    cpus_per_task: 8
    nodes: ${compute.nodes}
